<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HAARGEFLÜSTER Barcode Scanner</title>

  <!-- ZXing Browser: robuste 1D-Barcode-Erkennung für EAN/UPC/Code128 -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #20272d;
      color: #fff;
      padding: max(18px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 620px; margin: 0 auto; }
    .kopf {
      background: #f6eadc;
      color: #222;
      border-radius: 14px 14px 0 0;
      padding: 22px 18px 18px;
      text-align: center;
      border-bottom: 4px solid #a9785d;
    }
    .kopf h1 { margin: 0; font-size: 24px; letter-spacing: .5px; }
    .kopf p { margin: 7px 0 0; color: #66594f; font-size: 14px; }

    .box {
      background: #f6eadc;
      color: #222;
      border-radius: 0 0 14px 14px;
      padding: 14px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
      min-height: 260px;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 260px;
      max-height: 62vh;
      object-fit: cover;
      background: #111;
    }

    .scan-rahmen {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 32%;
      height: 36%;
      border: 3px solid rgba(255,255,255,.92);
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.15);
    }

    .scan-linie {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      background: rgba(255,255,255,.9);
      pointer-events: none;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      background: #eee3d7;
      color: #5e5147;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }
    #status.erfolg { background: #dfe9df; color: #334b37; }
    #status.fehler { background: #f1dddd; color: #6c3333; }

    .code {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 9px;
      background: #fffaf4;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }
    .code.aktiv { display: block; }

    .hinweis {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.45;
      color: #77695e;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      padding: 14px 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .neu { background: #a9785d; color: #fff; display: none; }
    .neu.aktiv { display: block; }
    .zurueck { background: #ded2c5; color: #222; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="kopf">
      <h1>HAARGEFLÜSTER</h1>
      <p>Barcode Scanner</p>
    </div>

    <div class="box">
      <div class="video-wrap">
        <video id="video" playsinline muted></video>
        <div class="scan-rahmen"></div>
        <div class="scan-linie"></div>
      </div>

      <div id="status">Kamera wird gestartet …</div>
      <div id="code" class="code"></div>

      <button id="neuBtn" class="neu" type="button" onclick="scannerNeuStarten()">
        WEITEREN BARCODE SCANNEN
      </button>

      <button class="zurueck" type="button" onclick="zurSalonApp()">
        ← ZUR SALON-APP
      </button>

      <div class="hinweis">
        Barcode waagerecht halten, möglichst nah herangehen und kurz ruhig halten.
        Produkt- und Bestelldaten bleiben in der Salon-App.
      </div>
    </div>
  </div>

<script>
let controls = null;
let reader = null;
let letzterCode = '';
let erkannt = false;

function statusSetzen(text, typ) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = typ || '';
}

function codeAnzeigen(code) {
  const el = document.getElementById('code');
  el.textContent = code;
  el.classList.add('aktiv');
  document.getElementById('neuBtn').classList.add('aktiv');
}

function codeUebertragen(code) {
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'HAARGEFLUESTER_BARCODE',
        code: String(code)
      }, '*');
      return true;
    }
  } catch (e) {}
  return false;
}

function scannerStoppen() {
  try {
    if (controls) controls.stop();
  } catch (e) {}
  controls = null;

  const video = document.getElementById('video');
  try {
    const stream = video.srcObject;
    if (stream && stream.getTracks) {
      stream.getTracks().forEach(t => t.stop());
    }
  } catch (e) {}
  try { video.srcObject = null; } catch (e) {}
}

async function scannerStarten() {
  letzterCode = '';
  erkannt = false;
  document.getElementById('code').classList.remove('aktiv');
  document.getElementById('neuBtn').classList.remove('aktiv');
  statusSetzen('Kamera wird gestartet …');

  if (!window.ZXingBrowser || !ZXingBrowser.BrowserMultiFormatReader) {
    statusSetzen('Scanner-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.', 'fehler');
    return;
  }

  try {
    reader = new ZXingBrowser.BrowserMultiFormatReader();

    const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    if (!devices || !devices.length) {
      throw new Error('Keine Kamera gefunden.');
    }

    // Wenn möglich die rückseitige Kamera wählen.
    let deviceId = devices[0].deviceId;
    const rear = devices.find(d => /back|rear|environment|rück|hinten/i.test(d.label || ''));
    if (rear) deviceId = rear.deviceId;

    controls = await reader.decodeFromVideoDevice(
      deviceId,
      'video',
      function(result, error, ctrl) {
        if (!result || erkannt) return;

        let code = String(result.getText ? result.getText() : result.text || '').trim();

        // EAN/UPC sind numerisch; Code128 darf ggf. auch Zeichen enthalten.
        if (!code || code === letzterCode) return;

        letzterCode = code;
        erkannt = true;

        try { ctrl.stop(); } catch (e) {}
        controls = null;

        const uebertragen = codeUebertragen(code);
        codeAnzeigen(code);

        if (uebertragen) {
          statusSetzen('Barcode erkannt und an die Salon-App übertragen.', 'erfolg');
          setTimeout(function() {
            try { window.close(); } catch (e) {}
          }, 700);
        } else {
          statusSetzen(
            'Barcode erkannt. Die Salon-App konnte nicht automatisch erreicht werden. Bitte zurück zur Salon-App wechseln.',
            'fehler'
          );
        }
      }
    );

    // Nach Start höhere Kamera-Auflösung / Autofokus anfragen, sofern unterstützt.
    try {
      const video = document.getElementById('video');
      const stream = video.srcObject;
      const track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      if (track && track.applyConstraints) {
        await track.applyConstraints({
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [
            { focusMode: 'continuous' }
          ]
        });
      }
    } catch (e) {
      // Nicht jedes iPhone unterstützt diese Zusatz-Constraints.
    }

    statusSetzen('Scanner aktiv – Barcode waagerecht und vollständig in den Rahmen halten.');
  } catch (e) {
    console.error(e);
    statusSetzen(
      'Kamera konnte gestartet werden, aber der Scanner ist nicht aktiv. Seite bitte neu laden und erneut versuchen.',
      'fehler'
    );
  }
}

function scannerNeuStarten() {
  scannerStoppen();
  setTimeout(scannerStarten, 250);
}

function zurSalonApp() {
  scannerStoppen();
  try { window.close(); } catch (e) {}
  if (window.opener && !window.opener.closed) {
    try { window.opener.focus(); } catch (e) {}
  }
}

window.addEventListener('load', scannerStarten);
window.addEventListener('beforeunload', scannerStoppen);
</script>
</body>
</html>
